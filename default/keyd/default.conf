# R2-D2 keyboard remaps (system-wide via keyd).
# Caps Lock → Left Super (Win). Caps Lock itself is disabled so games cannot
# leave the lock state stuck on (uppercase typing) while Super still works.

[ids]
*

[main]
capslock = leftmeta
# leftmeta stays leftmeta — both Caps and Win act as Super; no Caps Lock key.

# Copilot on some machines (kernel 6.14+): F23+Shift+Meta
f23+leftshift+leftmeta = rightcontrol
# Copilot on HP ZBook (firmware): Shift+Meta only, no F23
leftshift+leftmeta = rightcontrol
