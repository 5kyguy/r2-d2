# Fixed R2-D2 palette. Wallpaper pixels snap to one named source
# (bin/r2-d2-theme-accent-from-bg). An explicit accent that is not a named
# source snaps to the nearest named source. Black and White are monochrome.
# Shared signals and the light neutrals are copied into every document.

danger = "#FF2A4A"
on_danger = "#2A0008"
warning = "#FFB000"
on_warning = "#2A2100"

[light]
bg = "#FAFAFA"
surface = "#F4F4F4"
text = "#141414"
muted = "#525252"

[accents.black]
source = "#000000"
scheme = "monochrome"

[accents.black.dark]
accent = "#FFFFFF"
on_accent = "#0A0A0A"
deep = "#2A2A2A"
spark = "#F4F4F4"
on_spark = "#0A0A0A"
bg = "#0A0A0A"
surface = "#161616"
text = "#F4F4F4"
muted = "#9A9A9A"
line = "#3A3A3A"

[accents.black.light]
accent = "#111111"
on_accent = "#FFFFFF"
deep = "#111111"
spark = "#F4F4F4"
on_spark = "#0A0A0A"
line = "#6E6E6E"

