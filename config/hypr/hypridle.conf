general {
    lock_cmd = r2-d2-lock-screen                         # lock screen and 1password
    before_sleep_cmd = loginctl lock-session               # lock before suspend.
    after_sleep_cmd = sleep 1 && hyprctl dispatch "hl.dsp.dpms(true)"  # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

listener {
    timeout = 120                                            # 2min: lock, then screensaver
    on-timeout = r2-d2-idle-timeout lock
}

listener {
    timeout = 180                                            # 3min: keyboard backlight off
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

listener {
    timeout = 300                                            # 5min: screensaver has run 3min; screen off on battery
    on-timeout = r2-d2-idle-timeout screen-off
    on-resume = hyprctl dispatch "hl.dsp.dpms(true)"
}

listener {
    timeout = 1920                                           # 32min: screensaver has run 30min; screen off on AC
    on-timeout = hyprctl dispatch "hl.dsp.dpms(false)"
    on-resume = hyprctl dispatch "hl.dsp.dpms(true)"
}
