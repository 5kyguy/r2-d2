## Connect the music link first. The hands-free link stays available and is
## used when something records from the headset microphone.

monitor.bluez.properties = {
  bluez5.auto-connect = [ a2dp_sink a2dp_source ]
}

wireplumber.components = [
  {
    name = bluetooth-prefer-a2dp.lua, type = script/lua
    provides = script.bluetooth-prefer-a2dp
  }
]

wireplumber.profiles = {
  main = {
    script.bluetooth-prefer-a2dp = required
  }
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}
