[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 9

[window]
padding.x = 14
padding.y = 14
decorations = "None"
opacity = 0.75

[keyboard]
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  { key = "Return", mods = "Shift", chars = "\u001B\r" },
]

[colors]
[colors.primary]
background = "#0c0c0c"
foreground = "#f7f7f7"
dim_foreground = "#a3a3a3"

[colors.cursor]
text = "#0c0c0c"
cursor = "#ffffff"

[colors.selection]
text = "CellForeground"
background = "#e6e6e6"

[colors.normal]
black = "#181818"
red = "#ff2a4a"
green = "#e6e6e6"
yellow = "#ffffff"
blue = "#ffffff"
magenta = "#f7f7f7"
cyan = "#e6e6e6"
white = "#f7f7f7"

[colors.bright]
black = "#a3a3a3"
red = "#ff2a4a"
green = "#ffffff"
yellow = "#ffb000"
blue = "#ffffff"
magenta = "#ff2a4a"
cyan = "#ffffff"
white = "#f7f7f7"
