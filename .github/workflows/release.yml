name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Strip a leading "v" to match "## [0.1.0]" in the changelog.
          VERSION="${TAG#v}"
          # Slice from the matching header up to (not including) the next "## ["
          # header, or the trailing reference-link footer ("[0.1.x]: ...").
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section && /^\[[0-9]/ { exit }
            in_section { print }
          ' CHANGELOG.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION (expected \"## [$VERSION]\"). Aborting before publish."
            exit 1
          fi

          echo "Extracted notes for $VERSION:"
          cat /tmp/notes.md
          echo "path=/tmp/notes.md" >> "$GITHUB_OUTPUT"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "R2-D2 $GITHUB_REF_NAME" \
            --notes-file "$NOTES"
